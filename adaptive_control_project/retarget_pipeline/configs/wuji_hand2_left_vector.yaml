# Wuji Hand 2.1 left hand -- VectorOptimizer (15 key vectors wrist -> {PIP, DIP, tip}).
optimizer:
  type: "VectorOptimizer"
  hand_side: "left"
  urdf_path: "../../third_party/wuji-description-pinned/hand2/hand2_beta1/body/urdf/left.urdf"
  link_naming:
    prefix: "l_"
    palm:    "wrist"
    fingers: [thumb, index_finger, middle_finger, ring_finger, pinky]
    pip:     "{finger}_middle"
    dip:     "{finger}_distal"
    tip:     "{finger}_tip"
    link1:   "{finger}_proximal_abd"
retarget:
  huber_delta: 2.0
  norm_delta: 0.04
  lp_alpha: 0.2
  key_vectors:
    - {origin: l_wrist, task: l_thumb_middle,         origin_kp: 0, task_kp:  2, scale: 1.0}
    - {origin: l_wrist, task: l_thumb_distal,         origin_kp: 0, task_kp:  3, scale: 1.0}
    - {origin: l_wrist, task: l_thumb_tip,            origin_kp: 0, task_kp:  4, scale: 1.0}
    - {origin: l_wrist, task: l_index_finger_middle,  origin_kp: 0, task_kp:  6, scale: 1.0}
    - {origin: l_wrist, task: l_index_finger_distal,  origin_kp: 0, task_kp:  7, scale: 1.0}
    - {origin: l_wrist, task: l_index_finger_tip,     origin_kp: 0, task_kp:  8, scale: 1.0}
    - {origin: l_wrist, task: l_middle_finger_middle, origin_kp: 0, task_kp: 10, scale: 1.0}
    - {origin: l_wrist, task: l_middle_finger_distal, origin_kp: 0, task_kp: 11, scale: 1.0}
    - {origin: l_wrist, task: l_middle_finger_tip,    origin_kp: 0, task_kp: 12, scale: 1.0}
    - {origin: l_wrist, task: l_ring_finger_middle,   origin_kp: 0, task_kp: 14, scale: 1.0}
    - {origin: l_wrist, task: l_ring_finger_distal,   origin_kp: 0, task_kp: 15, scale: 1.0}
    - {origin: l_wrist, task: l_ring_finger_tip,      origin_kp: 0, task_kp: 16, scale: 1.0}
    - {origin: l_wrist, task: l_pinky_middle,         origin_kp: 0, task_kp: 18, scale: 1.0}
    - {origin: l_wrist, task: l_pinky_distal,         origin_kp: 0, task_kp: 19, scale: 1.0}
    - {origin: l_wrist, task: l_pinky_tip,            origin_kp: 0, task_kp: 20, scale: 1.0}
  mediapipe_rotation:   # shipped left-hand convention (adaptive_analytical_wuji_glove_wuji_hand_2_left.yaml)
    x: 180.0
    y: 0.0
    z: -90.0
