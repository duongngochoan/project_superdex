# Wuji Hand 2.1 right hand -- AdaptiveOptimizerAnalytical (official shipped config as base;
# only urdf_path is re-pointed at the pinned wuji-description hand2_beta1 URDF (matches the SuperDex asset)).
optimizer:
  type: "AdaptiveOptimizerAnalytical"
  hand_side: "right"
  urdf_path: "../../third_party/wuji-description-pinned/hand2/hand2_beta1/body/urdf/right.urdf"
  link_naming:
    prefix: "r_"
    palm:    "wrist"
    fingers: [thumb, index_finger, middle_finger, ring_finger, pinky]
    pip:     "{finger}_middle"
    dip:     "{finger}_distal"
    tip:     "{finger}_tip"
    link1:   "{finger}_proximal_abd"
retarget:
  huber_delta: 2.0
  huber_delta_dir: 0.5
  norm_delta: 0.04
  w_pos: 1.0
  w_dir: 2.0
  scaling: 1.0
  w_full_hand: 1.0
  thumb_skip_pip: false
  w_hyper: 1.0
  soft_min: 0.0
  w_couple: 0.1
  couple_ratio: 0.7
  lp_alpha: 0.2
  segment_scaling:
    thumb:  [1.0, 1.0, 1.0]
    index:  [1.0, 1.0, 1.0]
    middle: [1.0, 1.0, 1.0]
    ring:   [1.0, 1.0, 1.0]
    pinky:  [1.0, 1.0, 1.0]
  pinch_thresholds:
    index:  { d1: 2.0, d2: 4.0 }
    middle: { d1: 2.0, d2: 4.0 }
    ring:   { d1: 2.0, d2: 4.0 }
    pinky:  { d1: 2.0, d2: 4.0 }
  mediapipe_rotation:
    x: 0.0
    y: 180.0
    z: -90.0
